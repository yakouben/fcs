<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCS - Site en construction</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss.config = {
      theme: {
        extend: {
          colors: {
            gold: '#C6A962',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.8) rotate(-10deg); }
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes progressFill {
      from { width: 0%; }
      to { width: 60%; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-up {
      animation: fadeUp 0.8s ease-out forwards;
      opacity: 0;
    }
    .animate-scale-in {
      animation: scaleIn 0.5s ease-out forwards;
      opacity: 0;
    }
    .animate-fade-in {
      animation: fadeIn 0.6s ease-out forwards;
      opacity: 0;
    }
    .animate-progress {
      animation: progressFill 1.5s ease-out 1.2s forwards;
    }
    .delay-200 { animation-delay: 0.2s; }
    .delay-400 { animation-delay: 0.4s; }
    .delay-600 { animation-delay: 0.6s; }
    .delay-700 { animation-delay: 0.7s; }
    .delay-800 { animation-delay: 0.8s; }
    .delay-1000 { animation-delay: 1s; }
    .delay-1200 { animation-delay: 1.2s; }
    .delay-1500 { animation-delay: 1.5s; }
    .dot-pattern {
      background-image: radial-gradient(circle at 1px 1px, #1a1a1a 1px, transparent 0);
      background-size: 40px 40px;
    }
  </style>
</head>
<body class="bg-[#FAF9F6] font-sans">

  <div class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden px-6">

    <!-- Subtle dot pattern -->
    <div class="absolute inset-0 opacity-[0.02] dot-pattern"></div>

    <!-- Gold accent line at top -->
    <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-gold to-transparent"></div>

    <div class="relative z-10 flex flex-col items-center text-center max-w-xl">

      <!-- Logo -->
      <div class="mb-10 animate-scale-in delay-200">
        <img src="logo-fcs.png" alt="FCS" class="w-24 h-24 opacity-90" />
      </div>

      <!-- Construction icon (hardhat SVG) -->
      <div class="w-20 h-20 rounded-2xl bg-gold/10 border border-gold/20 flex items-center justify-center mb-8 animate-scale-in delay-400">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C6A962" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v2z"/>
          <path d="M10 15V6.5a3.5 3.5 0 0 1 7 0V15"/>
          <path d="M4 15v-5a6 6 0 0 1 6-6"/>
          <path d="M14 4a2 2 0 0 1 0 4"/>
        </svg>
      </div>

      <!-- Title -->
      <h1 class="text-3xl sm:text-4xl font-light tracking-wide text-[#1a1a1a] mb-4 animate-fade-up delay-600">
        Site en construction
      </h1>

      <!-- Subtitle -->
      <p class="text-[#888] font-light tracking-wide text-base sm:text-lg leading-relaxed mb-10 animate-fade-up delay-700">
        Nous travaillons sur quelque chose d'exceptionnel.<br />
        Notre nouveau site arrive tr&egrave;s bient&ocirc;t.
      </p>

      <!-- Animated progress bar -->
      <div class="w-48 h-[1px] bg-[#e5e5e5] relative mb-10 animate-fade-in delay-800">
        <div class="absolute top-0 left-0 h-full bg-gold animate-progress" style="width: 0%;"></div>
      </div>

      <!-- Coming soon -->
      <div class="flex items-center gap-2 text-[#999] text-sm font-light tracking-[0.15em] uppercase mb-12 animate-fade-in delay-1000">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>Bient&ocirc;t disponible</span>
      </div>

      <!-- Contact section -->
      <div class="flex flex-col items-center gap-4 animate-fade-up delay-1200">
        <p class="text-[11px] font-light tracking-[0.15em] uppercase text-[#aaa] mb-2">
          Contactez-nous en attendant
        </p>

        <div class="flex items-center gap-4">
          <!-- Phone -->
          <a href="tel:+33XXXXXXXXX" class="w-10 h-10 rounded-full border border-[#ddd] flex items-center justify-center text-[#888] hover:text-gold hover:border-gold/40 transition-all duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </a>
          <!-- Email -->
          <a href="mailto:contact@fcs-agencement.fr" class="w-10 h-10 rounded-full border border-[#ddd] flex items-center justify-center text-[#888] hover:text-gold hover:border-gold/40 transition-all duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="16" x="2" y="4" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </a>
          <!-- Instagram -->
          <a href="https://www.instagram.com/fcs_concept/" target="_blank" rel="noopener noreferrer" class="w-10 h-10 rounded-full border border-[#ddd] flex items-center justify-center text-[#888] hover:text-gold hover:border-gold/40 transition-all duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
              <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
            </svg>
          </a>
        </div>
      </div>

    </div>

    <!-- Bottom copyright -->
    <p class="absolute bottom-6 text-[11px] font-light tracking-wider text-[#ccc] animate-fade-in delay-1500">
      FCS Froid Cuisine Service &mdash; L'Art du Froid &amp; d'Agencement
    </p>

  </div>

</body>
</html>
